const ktRoles=['Admin','Treasurer','Pastor'];
function ktRole(){return ktCurrentUser?.role||'Guest'}
function ktIsAdmin(){return ktRole()==='Admin'}
function ktIsTreasurer(){return ktRole()==='Treasurer'}
function ktIsPastor(){return ktRole()==='Pastor'}
function ktCanEdit(){return ktIsAdmin()||ktIsTreasurer()}
function ktCanApprove(){return ktIsAdmin()||ktIsPastor()}
function ktSaveExtra(){const m={kt_users:ktUsers,kt_current_user:ktCurrentUser,kt_assemblies:ktAssemblies,kt_payroll:ktPayroll,kt_payment_requests:ktPaymentRequests,kt_bank_details:ktBankDetails,kt_audit:ktAudit,kt_legacy_queue:ktLegacyQueue};Object.entries(m).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)))}
function ktLog(action,details=''){ktAudit.unshift({id:uid(),date:new Date().toISOString(),user:ktCurrentUser?.email||'system',role:ktRole(),action,details});ktSaveExtra()}
function ktRequireEdit(){if(!ktCanEdit()){alert('Not authorized. This account is view-only.');return false}return true}
function ktAssemblyOf(x){return x.assembly||'Southlea Park'}
function ktSafeRoleOptions(selected='Pastor'){return ktRoles.map(r=>`<option ${r===selected?'selected':''}>${r}</option>`).join('')}
function showAuth(){let signedIn=ktCurrentUser?`<div class="success-note">Signed in as <b>${esc(ktCurrentUser.email)}</b> · ${esc(ktRole())}</div><button class="danger" onclick="ktSignOut()">Sign out</button>`:'';showModal('Kingdom Treasure account access',`${signedIn}<div class="notice">Prototype mode: accounts and roles are stored in this browser only. This is not secure authentication. Do not use real financial or banking data until server-side authentication and database policies are configured.</div><div class="grid two-col"><section><h4>Create account</h4><div class="field"><label>Full name</label><input id="authName"></div><div class="field"><label>Email</label><input id="authEmail" type="email"></div><div class="field"><label>Password (prototype only)</label><input id="authPassword" type="password" minlength="8"></div><div class="field"><label>Requested role</label><select id="authRole">${ktSafeRoleOptions('Pastor')}</select></div><button class="primary" onclick="ktSignUp()">Sign up</button></section><section><h4>Sign in</h4><div class="field"><label>Email</label><input id="loginEmail" type="email"></div><div class="field"><label>Password</label><input id="loginPassword" type="password"></div><button class="primary" onclick="ktSignIn()">Sign in</button></section></div><p class="muted mini">The first prototype account becomes Admin; subsequent accounts are assigned Pastor by default. In production, first-admin provisioning must be done securely on the server.</p>`)}
function ktSignUp(){let name=$('#authName').value.trim(),email=$('#authEmail').value.trim().toLowerCase(),password=$('#authPassword').value;if(!name||!email||password.length<8)return alert('Enter a name, valid email and password of at least 8 characters.');if(ktUsers.some(u=>u.email===email))return alert('An account with this email already exists.');let user={id:uid(),name,email,password,role:ktUsers.length===0?'Admin':'Pastor',assembly:'Southlea Park',createdAt:new Date().toISOString()};ktUsers.push(user);ktCurrentUser={id:user.id,name:user.name,email:user.email,role:user.role,assembly:user.assembly};ktSaveExtra();ktLog('Account created',email);closeModal();render();alert('Prototype account created. Admin controls role assignment. Secure production sign-up is not active until backend setup.')}
function ktSignIn(){let email=$('#loginEmail').value.trim().toLowerCase(),password=$('#loginPassword').value,u=ktUsers.find(x=>x.email===email&&x.password===password);if(!u)return alert('Sign-in failed. Check credentials or create an account.');ktCurrentUser={id:u.id,name:u.name,email:u.email,role:u.role,assembly:u.assembly||'Southlea Park'};ktSaveExtra();ktLog('Sign in');closeModal();render()}
function ktSignOut(){ktCurrentUser=null;ktSaveExtra();closeModal();render()}
function ktAssignRole(id,role){if(!ktIsAdmin())return alert('Not authorized. Only Admin can assign roles.');let u=ktUsers.find(x=>x.id===id);if(!u)return;if(role==='Treasurer'&&u.role!=='Treasurer'&&ktUsers.filter(x=>x.role==='Treasurer').length>=3)return alert('Maximum of 3 Treasurer accounts reached.');u.role=role;ktSaveExtra();ktLog('Role changed',u.email+' → '+role);render()}
function ktSetAssembly(id,assembly){if(!ktIsAdmin())return alert('Not authorized. Only Admin can change assembly assignments.');let u=ktUsers.find(x=>x.id===id);if(u){u.assembly=assembly;ktSaveExtra();ktLog('Assembly assignment',u.email+' → '+assembly);render()}}
function ktAddAssembly(){if(!ktIsAdmin())return alert('Only Admin can add assemblies.');let n=prompt('Assembly name');if(n&&n.trim()&&!ktAssemblies.includes(n.trim())){ktAssemblies.push(n.trim());ktSaveExtra();ktLog('Assembly added',n.trim());render()}}

let page='dashboard', modalKind=null;
function save(){localStorage.setItem('kt_settings',JSON.stringify(settings));localStorage.setItem('kt_transactions',JSON.stringify(transactions));localStorage.setItem('kt_pledges',JSON.stringify(pledges));localStorage.setItem('kt_claims',JSON.stringify(claims));localStorage.setItem('kt_assets',JSON.stringify(assets));localStorage.setItem('kt_campaigns',JSON.stringify(campaigns));ktSaveExtra()}
function txPosted(t){return t.status!=='Pending'&&t.status!=='Cancelled'&&t.status!=='Rejected'}
function amountBase(t){return num(t.baseAmount!==undefined?t.baseAmount:t.amount)}
function inPeriod(date,from,to){return (!from||date>=from)&&(!to||date<=to)}
function allTransactions(){return transactions.filter(txPosted)}
function incomeRows(from='',to=''){return allTransactions().filter(t=>t.direction==='Income'&&inPeriod(t.date,from,to))}
function expenseRows(from='',to=''){return allTransactions().filter(t=>t.direction==='Expense'&&!t.settlement&&inPeriod(t.date,from,to))}
function sum(rows){return rows.reduce((a,t)=>a+amountBase(t),0)}
function cashBalance(){return allTransactions().filter(t=>t.paymentStatus!=='Unpaid'&&t.method!=='Accrued payable').reduce((a,t)=>a+(t.direction==='Income'?1:-1)*amountBase(t),0)}
function payableBalance(){let claimRefs=new Set(claims.map(c=>'PAY-'+c.id));return claims.filter(c=>c.status==='Approved'||c.status==='Partially Paid').reduce((a,c)=>a+Math.max(0,num(c.amount)-num(c.paid)),0)+transactions.filter(t=>t.direction==='Expense'&&t.paymentStatus==='Unpaid'&&txPosted(t)&&!claimRefs.has(t.reference)).reduce((a,t)=>a+amountBase(t),0)}
function pageMeta(p){return {dashboard:['Dashboard',"Your church's financial overview"],transactions:['Income & Expenses','Record and manage church financial transactions'],pledges:['Pledges','Track commitments and payment progress'],claims:['Payables & Reimbursements','Manage invoices, debts and receipt-backed claims'],assets:['Assets & Inventory','Track church assets, donated goods and stock for resale'],fundraising:['Fundraising & Resale','Monitor campaigns, sales and project proceeds'],reports:['Reports & Statements','Generate period-based reports and financial statements'],import:['Excel Import / Export','Import historical records and export data safely'],settings:['Church Settings','Configure church identity, reporting currency and periods']}[p]}
function go(p){if(!ktCurrentUser){showAuth();return}page=p;$('#sidebar').classList.remove('open');$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let m=pageMeta(p);$('#topTitle').textContent=m[0];$('#topSubtitle').textContent=m[1];render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});

function ktNum(n){return Number(n||0)}
function ktPayslip(p){let gross=ktNum(p.basic)+ktNum(p.housing)+ktNum(p.transport)+ktNum(p.health),levy=ktNum(p.paye)*ktNum(p.aidsLevyRate??.03),empNssa=ktNum(p.basic)*ktNum(p.employeeNssaRate??.045),net=gross-ktNum(p.paye)-levy-empNssa-ktNum(p.tithe||0);return {gross,levy,empNssa,employerNssa:ktNum(p.basic)*ktNum(p.employerNssaRate??.045),net}}
function renderAccess(){let rows=ktUsers.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><select ${!ktIsAdmin()?'disabled':''} onchange="ktAssignRole('${u.id}',this.value)">${ktSafeRoleOptions(u.role)}</select></td><td><select ${!ktIsAdmin()?'disabled':''} onchange="ktSetAssembly('${u.id}',this.value)">${ktAssemblies.map(a=>`<option ${a===(u.assembly||'Southlea Park')?'selected':''}>${esc(a)}</option>`).join('')}</select></td><td>${esc(new Date(u.createdAt||Date.now()).toLocaleDateString())}</td></tr>`).join('');$('#content').innerHTML=pageHead('Users & Access','Admin assigns roles. Treasurers edit and request payments; Pastors view, print and approve outflows.',`<button class="primary" onclick="showAuth()">＋ Sign up / sign in</button>`)+`<div class="notice">Prototype controls only. Browser-local roles are not security boundaries. Production must enforce permissions through authenticated server-side policies.</div><div class="grid three-col"><div class="card"><h3>Admin</h3><p>Assign roles, manage assemblies, users and settings.</p></div><div class="card"><h3>Treasurer (max 3)</h3><p>Edit accounting records, payroll drafts and request payments. Cannot approve or execute payments.</p></div><div class="card"><h3>Pastor</h3><p>View records, print reports and approve/reject payment requests. Cannot edit accounting records.</p></div></div><section class="card" style="margin-top:15px"><div class="split"><h3 class="section-title">Registered accounts</h3><span class="pill">${ktUsers.filter(u=>u.role==='Treasurer').length}/3 Treasurers</span></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Assembly</th><th>Created</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">No accounts yet. Create the first account.</td></tr>'}</tbody></table></div></section><section class="card" style="margin-top:15px"><h3 class="section-title">Audit log</h3><div class="table-wrap"><table><thead><tr><th>When</th><th>User</th><th>Role</th><th>Action</th><th>Details</th></tr></thead><tbody>${ktAudit.slice(0,30).map(a=>`<tr><td>${esc(new Date(a.date).toLocaleString())}</td><td>${esc(a.user)}</td><td>${esc(a.role)}</td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>`).join('')||'<tr><td colspan="5">No events recorded.</td></tr>'}</tbody></table></div></section>`}
function renderAssemblies(){let counts=ktAssemblies.map(a=>{let tx=allTransactions().filter(t=>ktAssemblyOf(t)===a),inc=sum(tx.filter(t=>t.direction==='Income')),exp=sum(tx.filter(t=>t.direction==='Expense'&&!t.settlement));return `<tr><td>${esc(a)}</td><td>${tx.length}</td><td>${fmt(inc,settings.currency)}</td><td>${fmt(exp,settings.currency)}</td><td>${fmt(inc-exp,settings.currency)}</td></tr>`}).join('');$('#content').innerHTML=pageHead('Assemblies','Keep accounting records separated by assembly.',ktIsAdmin()?`<button class="primary" onclick="ktAddAssembly()">＋ Add assembly</button>`:'')+`<div class="notice">Assign every transaction, pledge, claim, asset, campaign and payroll record to an assembly. Historical imports are staged separately until reconciled.</div><section class="card"><div class="table-wrap"><table><thead><tr><th>Assembly</th><th>Transactions</th><th>Income</th><th>Expenses</th><th>Net movement</th></tr></thead><tbody>${counts}</tbody></table></div></section>`}
function renderPayroll(){let rows=ktPayroll.slice().sort((a,b)=>(b.period||'').localeCompare(a.period)).map(p=>{let c=ktPayslip(p);return `<tr><td>${esc(p.name)}</td><td>${esc(p.assembly)}</td><td>${esc(p.period)}</td><td>${fmt(c.gross,p.currency||'USD')}</td><td>${fmt(c.net,p.currency||'USD')}</td><td><span class="pill ${p.status==='Approved'?'approved':'pending'}">${esc(p.status)}</span></td><td><button class="outline small" onclick="printPayslip('${p.id}')">Print payslip</button></td></tr>`}).join('');$('#content').innerHTML=pageHead('Pastoral Payroll','Create payroll runs and populate payslips from the supplied CFMI template.',ktCanEdit()?`<button class="primary" onclick="openPayrollModal()">＋ Add pastor / run payroll</button>`:'')+`<div class="notice">Template fields follow the uploaded CFMI payslip. Example values are defaults only; verify current PAYE, AIDS Levy, NSSA and tithe calculations before use. Banking details must be stored encrypted on a secure server in production.</div><div class="grid stats">${cardStat('♙','Pastors with bank details',String(ktBankDetails.length),'Saved payroll profiles')}${cardStat('▣','Payroll runs',String(ktPayroll.length),'Generated payslips')}${cardStat('✓','Approved payroll',String(ktPayroll.filter(p=>p.status==='Approved').length),'Pastoral approval required')}${cardStat('↗','Total net payroll',fmt(ktPayroll.reduce((s,p)=>s+ktPayslip(p).net,0),'USD'),'Across saved payroll runs')}</div><section class="card"><h3 class="section-title">Payroll register</h3><div class="table-wrap"><table><thead><tr><th>Pastor</th><th>Assembly</th><th>Period</th><th>Gross</th><th>Net pay</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No payroll runs yet.</td></tr>'}</tbody></table></div></section><section class="card" style="margin-top:15px"><h3 class="section-title">Payslip template fields</h3><p>Basic salary · Housing allowance · Transport allowance · Health insurance · PAYE · AIDS Levy · Employee NSSA · Employer NSSA · Tithe · Net pay · Payment date · Assembly · Authorisation</p><p class="muted mini">The supplied template calculates employee and employer NSSA at 4.5% of basic salary (not gross earnings); employer NSSA is reported as employer cost and not deducted from employee net pay. Tithe is entered as an approved deduction because the supplied template does not define its calculation base consistently.</p></section>`}
function openPayrollModal(){if(!ktRequireEdit())return;showModal('Pastor payroll profile / run',`<form id="payrollForm" onsubmit="event.preventDefault();savePayroll()"><div class="form-grid"><div class="field"><label>Pastor full name</label><input name="name" required></div><div class="field"><label>Assembly</label><select name="assembly">${ktAssemblies.map(a=>`<option>${esc(a)}</option>`).join('')}</select></div><div class="field"><label>Payroll period</label><input name="period" type="month" value="${today().slice(0,7)}" required></div><div class="field"><label>Payment date</label><input name="paymentDate" type="date" value="${today()}" required></div><div class="field"><label>Currency</label><select name="currency"><option>USD</option><option>EUR</option><option>ZAR</option><option>ZiG</option></select></div><div class="field"><label>Basic salary</label><input name="basic" type="number" step=".01" value="200" required></div><div class="field"><label>Housing allowance</label><input name="housing" type="number" step=".01" value="100"></div><div class="field"><label>Transport allowance</label><input name="transport" type="number" step=".01" value="50"></div><div class="field"><label>Health insurance</label><input name="health" type="number" step=".01" value="20"></div><div class="field"><label>PAYE</label><input name="paye" type="number" step=".01" value="25"></div><div class="field"><label>Tithe deduction (optional)</label><input name="tithe" type="number" step=".01" value="0"></div><div class="field"><label>Bank name</label><input name="bankName" required></div><div class="field"><label>Account holder</label><input name="accountHolder" required></div><div class="field"><label>Account number / IBAN</label><input name="accountNumber" required></div><div class="field"><label>SWIFT / branch code</label><input name="bankCode"></div><div class="field"><label>Pastor email</label><input name="email" type="email"></div></div><div class="notice">Do not enter real bank details in this browser-only prototype. Use secure server-side storage after backend setup.</div><button class="primary" type="submit">Save profile and generate payslip</button></form>`)}
function savePayroll(){if(!ktRequireEdit())return;let d=Object.fromEntries(new FormData($('#payrollForm')).entries());['basic','housing','transport','health','paye','tithe'].forEach(k=>d[k]=ktNum(d[k]));d.id=uid();d.status='Pending Pastoral Approval';d.createdAt=new Date().toISOString();d.employeeNssaRate=.045;d.employerNssaRate=.045;d.aidsLevyRate=.03;ktPayroll.push(d);ktBankDetails.push({id:d.id,name:d.name,assembly:d.assembly,bankName:d.bankName,accountHolder:d.accountHolder,accountNumber:d.accountNumber,bankCode:d.bankCode,email:d.email});ktSaveExtra();ktLog('Payroll generated',d.name+' '+d.period);closeModal();render();alert('Payslip generated. Payroll is pending Pastoral approval. Actual bank payment is not connected.')}
function printPayslip(id){let p=ktPayroll.find(x=>x.id===id);if(!p)return;let c=ktPayslip(p),w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print the payslip.');w.document.write(`<html><head><title>Pastoral Payslip</title><style>body{font:14px Arial;margin:35px;color:#142b25}h1,h2{text-align:center}table{width:100%;border-collapse:collapse;margin:12px 0}td,th{border:1px solid #aaa;padding:8px;text-align:left}.num{text-align:right}</style></head><body><h1>Consuming Fire Ministries International</h1><h2>PASTORAL PAYSLIP</h2><p><b>Name:</b> ${esc(p.name)} &nbsp; <b>Position:</b> Pastor – ${esc(p.assembly)}</p><p><b>Month:</b> ${esc(p.period)} &nbsp; <b>Payment Date:</b> ${esc(p.paymentDate)}</p><table><tr><th colspan="2">Earnings</th></tr><tr><td>Basic Salary</td><td class="num">${fmt(p.basic,p.currency)}</td></tr><tr><td>Housing Allowance</td><td class="num">${fmt(p.housing,p.currency)}</td></tr><tr><td>Transport Allowance</td><td class="num">${fmt(p.transport,p.currency)}</td></tr><tr><td>Health Insurance</td><td class="num">${fmt(p.health,p.currency)}</td></tr><tr><th>Gross earnings</th><th class="num">${fmt(c.gross,p.currency)}</th></tr><tr><th colspan="2">Deductions</th></tr><tr><td>PAYE</td><td class="num">${fmt(p.paye,p.currency)}</td></tr><tr><td>AIDS Levy</td><td class="num">${fmt(c.levy,p.currency)}</td></tr><tr><td>Employee NSSA</td><td class="num">${fmt(c.empNssa,p.currency)}</td></tr><tr><td>Tithe</td><td class="num">${fmt(p.tithe,p.currency)}</td></tr><tr><th>Total Net Pay</th><th class="num">${fmt(c.net,p.currency)}</th></tr><tr><td>Employer NSSA contribution (not deducted from net)</td><td class="num">${fmt(c.employerNssa,p.currency)}</td></tr></table><p>Bank: ${esc(p.bankName)} · Account holder: ${esc(p.accountHolder)} · Account: ••••${esc(String(p.accountNumber||'').slice(-4))}</p><p>Status: ${esc(p.status)}</p><p>Authorised by: __________________________</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function renderPaymentRequests(){let rows=ktPaymentRequests.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.assembly)}</td><td>${esc(r.requesterEmail)}</td><td>${esc(r.description)}</td><td>${fmt(r.amount,r.currency)}</td><td><span class="pill ${r.status==='Approved'?'approved':r.status==='Rejected'?'rejected':'pending'}">${esc(r.status)}</span></td><td>${ktCanApprove()&&r.status==='Pending Pastoral Approval'?`<button class="primary small" onclick="decidePayment('${r.id}','Approved')">Approve</button> <button class="danger small" onclick="decidePayment('${r.id}','Rejected')">Reject</button>`:'—'}</td></tr>`).join('');$('#content').innerHTML=pageHead('Payment Requests','Treasurers request outflows; only Pastoral accounts may approve them.',ktCanEdit()?`<button class="primary" onclick="openPaymentRequest()">＋ Request payment</button>`:'')+`<div class="notice"><b>Standing rule:</b> Treasurer accounts cannot approve or process payments. This prototype does not send email; configure server-side notifications for pastor sign-up emails in production.</div><section class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Assembly</th><th>Requester</th><th>Description</th><th>Amount</th><th>Status</th><th>Pastoral action</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No payment requests yet.</td></tr>'}</tbody></table></div></section>`}
function openPaymentRequest(){if(!ktRequireEdit())return;showModal('Request payment / cash outflow',`<form id="requestForm" onsubmit="event.preventDefault();submitPaymentRequest()"><div class="field"><label>Assembly</label><select name="assembly">${ktAssemblies.map(a=>`<option ${a===(ktCurrentUser?.assembly||'Southlea Park')?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="field"><label>Description / purpose</label><input name="description" required></div><div class="form-grid"><div class="field"><label>Amount</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Currency</label><select name="currency"><option>USD</option><option>EUR</option><option>ZAR</option><option>ZiG</option></select></div></div><div class="field"><label>Payee / supplier</label><input name="payee" required></div><div class="field"><label>Reference / notes</label><textarea name="notes"></textarea></div><button class="primary" type="submit">Submit for Pastoral approval</button></form>`)}
function submitPaymentRequest(){if(!ktRequireEdit())return;let d=Object.fromEntries(new FormData($('#requestForm')).entries());d.id=uid();d.date=today();d.amount=ktNum(d.amount);d.status='Pending Pastoral Approval';d.requesterEmail=ktCurrentUser?.email||'unassigned';d.createdAt=new Date().toISOString();d.approverEmails=ktUsers.filter(u=>u.role==='Pastor').map(u=>u.email);ktPaymentRequests.push(d);ktSaveExtra();ktLog('Payment requested',d.description+' '+d.amount+' '+d.currency);closeModal();render();alert('Request saved and awaiting Pastoral approval. Email delivery is not active until backend setup.')}
function decidePayment(id,status){if(!ktCanApprove()||!ktIsPastor())return alert('Not authorized. Only a Pastoral account can approve/reject this request.');let r=ktPaymentRequests.find(x=>x.id===id);if(!r)return;if(!confirm(status+' this payment request?'))return;r.status=status;r.decidedBy=ktCurrentUser?.email||'Pastor account';r.decidedAt=new Date().toISOString();ktSaveExtra();ktLog('Payment '+status,r.description+' by '+r.decidedBy);render();alert('Decision recorded. Actual payment processing is not connected.')}
function renderMasterReport(){let a=$('#masterAssembly')?.value||'All assemblies',from=$('#masterFrom')?.value||'',to=$('#masterTo')?.value||'',tx=allTransactions().filter(t=>(a==='All assemblies'||ktAssemblyOf(t)===a)&&inPeriod(t.date,from,to)),inc=sum(tx.filter(t=>t.direction==='Income')),exp=sum(tx.filter(t=>t.direction==='Expense'&&!t.settlement)),pl=pledges.filter(x=>a==='All assemblies'||ktAssemblyOf(x)===a),cl=claims.filter(x=>a==='All assemblies'||ktAssemblyOf(x)===a),as=assets.filter(x=>a==='All assemblies'||ktAssemblyOf(x)===a),pr=ktPayroll.filter(x=>(a==='All assemblies'||x.assembly===a)&&(!from||x.period+'-01'>=from)&&(!to||x.period+'-31'<=to));$('#content').innerHTML=pageHead('Master Report','Consolidated overview of all assemblies, income, expenditure, pledges, payables, assets and payroll.',`<button class="primary" onclick="window.print()">Print master report</button><button class="outline" onclick="exportWorkbook('all')">Export all records</button>`)+`<section class="card"><div class="toolbar"><label>Assembly <select id="masterAssembly" onchange="renderMasterReport()"><option>All assemblies</option>${ktAssemblies.map(x=>`<option ${x===a?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>From <input type="date" id="masterFrom" value="${from}" onchange="renderMasterReport()"></label><label>To <input type="date" id="masterTo" value="${to}" onchange="renderMasterReport()"></label></div><div class="grid stats">${cardStat('↙','Total income',fmt(inc,settings.currency),tx.filter(t=>t.direction==='Income').length+' transactions')}${cardStat('↗','Total expenses',fmt(exp,settings.currency),tx.filter(t=>t.direction==='Expense'&&!t.settlement).length+' transactions')}${cardStat('Σ','Net movement',fmt(inc-exp,settings.currency),'Income less expenses')}${cardStat('▣','Payroll net',fmt(pr.reduce((s,p)=>s+ktPayslip(p).net,0),'USD'),pr.length+' payslips')}</div><div class="grid three-col"><div class="card"><h3>Pledges</h3><p>${pl.length} records</p><b>${fmt(pl.reduce((s,x)=>s+ktNum(x.amount)-ktNum(x.paid),0),settings.currency)} outstanding</b></div><div class="card"><h3>Payables / claims</h3><p>${cl.length} records</p><b>${fmt(cl.reduce((s,x)=>s+Math.max(0,ktNum(x.amount)-ktNum(x.paid)),0),settings.currency)} outstanding</b></div><div class="card"><h3>Assets / inventory</h3><p>${as.length} records</p><b>${fmt(as.reduce((s,x)=>s+ktNum(x.value),0),settings.currency)} recorded value</b></div></div><h3 class="section-title" style="margin-top:20px">Transactions</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Assembly</th><th>Direction</th><th>Category</th><th>Description</th><th>Amount</th><th>Currency</th></tr></thead><tbody>${tx.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(ktAssemblyOf(t))}</td><td>${esc(t.direction)}</td><td>${esc(t.category||'')}</td><td>${esc(t.description||t.name||'')}</td><td>${fmt(amountBase(t),t.currency||settings.currency)}</td><td>${esc(t.currency||settings.currency)}</td></tr>`).join('')||'<tr><td colspan="7">No transactions for this filter.</td></tr>'}</tbody></table></div><h3 class="section-title" style="margin-top:20px">Automated report schedule</h3><p>Intended schedule: monthly report on the last calendar day and full annual statement at year-end to all account holders. A scheduled server job and email provider are required; this browser-only prototype cannot run while closed or send emails.</p></section>`}


function renderLegacyReview(){let state=$('#legacyState')?.value||'Needs Review',source=$('#legacySource')?.value||'All sources',rows=ktLegacyQueue.filter(r=>(state==='All'||r.status===state)&&(source==='All sources'||r.sourceFile===source));let sources=[...new Set(ktLegacyQueue.map(r=>r.sourceFile))];$('#content').innerHTML=pageHead('Legacy Financial Record Review','Historical data extracted from your uploaded CFMI spreadsheets. Records remain staged until reviewed and selected for posting.',ktCanEdit()?`<button class="primary" onclick="ktPostSelectedLegacy()">Post selected reviewed records</button>`:'')+`<div class="notice"><b>Accuracy warning:</b> ${ktLegacyWarnings.length} date/month or date-format issues were detected. Some ledger dates conflict with worksheet titles and source files may overlap. The system preserves original dates and source row references; do not post a record until reconciled against the source document. Posting does not automatically reconcile opening/closing balances.</div><div class="grid stats">${cardStat('▤','Staged rows',String(ktLegacyQueue.length),'Not included in financial totals')}${cardStat('◷','Needs review',String(ktLegacyQueue.filter(r=>r.status==='Needs Review').length),'Manual reconciliation required')}${cardStat('✓','Posted from legacy',String(ktLegacyQueue.filter(r=>r.status==='Posted').length),'Posted rows')}${cardStat('⚠','Source warnings',String(ktLegacyWarnings.length),'Check date review worksheet')}</div><section class="card"><div class="toolbar"><label>Status <select id="legacyState" onchange="renderLegacyReview()"><option>Needs Review</option><option>Posted</option><option>All</option></select></label><label>Source <select id="legacySource" onchange="renderLegacyReview()"><option>All sources</option>${sources.map(s=>`<option ${s===source?'selected':''}>${esc(s)}</option>`).join('')}</select></label><button class="outline" onclick="exportLegacyReview()">Export review queue</button></div><p class="muted mini">Select only rows that have been checked. Rows marked Posted cannot be posted again. Maximum display is 250 rows per view.</p><div class="table-wrap"><table><thead><tr><th>Select</th><th>Parsed date</th><th>Original date</th><th>Assembly</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Source / row</th><th>Status</th></tr></thead><tbody>${rows.slice(0,250).map(r=>`<tr><td>${r.status==='Needs Review'&&ktCanEdit()?`<input type="checkbox" class="legacyCheck" value="${r.id}">`:'—'}</td><td>${esc(r.date)}</td><td>${esc(r.originalDate)}</td><td>${esc(r.assembly)}</td><td>${esc(r.direction)}</td><td>${esc(r.category)}</td><td title="${esc(r.description)}">${esc(r.description).slice(0,90)}</td><td>${fmt(r.amount,r.currency)}</td><td>${esc(r.sourceFile)} · ${esc(r.sourceSheet)} · row ${r.sourceRow}</td><td><span class="pill ${r.status==='Posted'?'posted':'pending'}">${esc(r.status)}</span></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No rows match this filter.</td></tr>'}</tbody></table></div></section><section class="card" style="margin-top:15px"><h3 class="section-title">Source warnings</h3><p>Open the accompanying <b>CFMI_Historical_Import_Review.xlsx</b> workbook and review the “Date Review Warnings” sheet for the full list.</p><div class="table-wrap"><table><thead><tr><th>Source</th><th>Sheet</th><th>Excel row</th><th>Issue</th><th>Original date</th></tr></thead><tbody>${ktLegacyWarnings.slice(0,12).map(w=>`<tr><td>${esc(w['Source file'])}</td><td>${esc(w.Sheet)}</td><td>${esc(w['Excel row'])}</td><td>${esc(w.Issue)}</td><td>${esc(w['Original date / label'])}</td></tr>`).join('')}</tbody></table></div></section>`}
function ktPostSelectedLegacy(){if(!ktRequireEdit())return;let ids=$$('.legacyCheck:checked').map(x=>x.value);if(!ids.length)return alert('Select the records you have reviewed and reconciled first.');if(!confirm(`Post ${ids.length} selected historical records into the accounting ledger? They will affect financial reports.`))return;let posted=0;for(let id of ids){let r=ktLegacyQueue.find(x=>x.id===id);if(!r||r.status!=='Needs Review')continue;let t={id:uid(),direction:r.direction,date:r.date,assembly:r.assembly,category:r.category,amount:r.amount,currency:r.currency,rate:1,baseAmount:r.amount,method:'Other',account:'Historical import',paymentStatus:'Paid',name:'',reference:`${r.sourceFile} | ${r.sourceSheet} | row ${r.sourceRow}`,description:r.description,eventType:'Not applicable',fund:'Historical records',status:'Posted',sourceFile:r.sourceFile,sourceSheet:r.sourceSheet,sourceRow:r.sourceRow,originalDate:r.originalDate,createdAt:new Date().toISOString()};transactions.unshift(t);r.status='Posted';r.postedTransactionId=t.id;posted++}save();ktLog('Legacy records posted',`${posted} records`);renderLegacyReview();alert(`${posted} records posted. Review the Master Report and reconcile opening/closing balances.`)}
function exportLegacyReview(){if(!window.XLSX)return alert('Excel library unavailable.');let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ktLegacyQueue),'Legacy Import Queue');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ktLegacyWarnings),'Date Warnings');XLSX.writeFile(wb,'CFMI-Legacy-Import-Review.xlsx')}

function render(){ $('#activeRole').textContent=ktCurrentUser?`${ktCurrentUser.name} · ${ktRole()}`:'Setup required'; if(!ktCurrentUser){$('#content').innerHTML=pageHead('Account access required','Sign in or create an account to access Kingdom Treasure.')+'<div class="card"><p>Create an account to continue. Role assignment is managed by the Admin account.</p><button class="primary" onclick="showAuth()">Sign in / Sign up</button></div>';return;} if(page==='dashboard')renderDashboard();if(page==='transactions')renderTransactions();if(page==='pledges')renderPledges();if(page==='claims')renderClaims();if(page==='assets')renderAssets();if(page==='fundraising')renderFundraising();if(page==='reports')renderReports();if(page==='import')renderImport();if(page==='settings')renderSettings();if(page==='master')renderMasterReport();if(page==='legacy')renderLegacyReview();if(page==='payroll')renderPayroll();if(page==='requests')renderPaymentRequests();if(page==='assemblies')renderAssemblies();if(page==='access')renderAccess();}
