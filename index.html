<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdom Treasure | Church Management Software</title>
<meta name="description" content="Kingdom Treasure church financial management software">
<link rel="icon" href="Kingdom_Treasure_logo.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--green:#063f35;--green2:#08745c;--gold:#c79b35;--ink:#162b28;--muted:#647571;--bg:#f3f7f5;--line:#dfe8e3;--white:#fff;--red:#b83e43;--blue:#3267a8;--shadow:0 5px 22px rgba(22,43,40,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--green2);color:white}.gold{background:var(--gold);color:#1e281e}.secondary{background:#e8f0ec;color:var(--green)}.danger{background:#fff0ef;color:var(--red)}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.small{padding:6px 9px;font-size:12px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#052f2a,#06473a);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:2px 7px 20px;border-bottom:1px solid #ffffff25;margin-bottom:17px}.brand img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:12px}.brand strong{display:block;font-size:16px;line-height:1.1}.brand span{font-size:10px;color:#e9d49a}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#d9e8e2;text-align:left;font-weight:550;padding:11px 12px;border-radius:9px;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff1a;color:#fff}.nav .ico{width:19px;text-align:center}.sidebar-foot{font-size:11px;color:#a9c4b9;margin:25px 8px 0}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px;position:sticky;top:0;z-index:5}.topbar .left{display:flex;align-items:center;gap:12px;min-width:0}.topbar h1{font-size:18px;margin:0}.topbar p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.content{padding:26px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.page-head h2{margin:0;font-size:25px;letter-spacing:-.5px}.page-head p{color:var(--muted);margin:5px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat{display:flex;gap:12px;align-items:flex-start}.stat-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#e8f5ef;color:var(--green2);font-size:20px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;letter-spacing:-.7px;margin:5px 0 3px;overflow-wrap:anywhere}.stat small{color:var(--muted)}.two-col{grid-template-columns:1.15fr .85fr}.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}.section-title{font-size:16px;margin:0 0 14px}.muted{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:100%}.field{display:grid;gap:5px;margin-bottom:13px}.field label{font-weight:650;font-size:12px;color:#425650}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #d7e2dc;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);min-height:39px}.field textarea{min-height:78px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.span2{grid-column:span 2}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}th,td{padding:11px 12px;border-bottom:1px solid #edf1ee;text-align:left;white-space:nowrap;font-size:12px}th{background:#f7faf8;color:#5a6b65;font-size:11px;text-transform:uppercase;letter-spacing:.3px}tr:last-child td{border-bottom:0}.right{text-align:right}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#edf2ef;color:#53645d}.pill.paid,.pill.approved,.pill.posted{background:#e1f6e9;color:#087647}.pill.pending,.pill.pending-review{background:#fff1d8;color:#99600b}.pill.cancelled,.pill.rejected{background:#ffe7e7;color:#a92c36}.pill.partially-paid{background:#e7efff;color:#315b9b}.empty{padding:30px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;background:#fff8e7;border:1px solid #f0dfad;color:#6b561d;border-radius:10px;margin-bottom:15px;font-size:12px}.success-note{padding:11px 13px;background:#e8f7ef;border:1px solid #c5e8d4;border-radius:9px;color:#12603f;margin-bottom:12px}.hidden{display:none!important}.bar-list{display:grid;gap:13px}.bar-row{display:grid;grid-template-columns:130px 1fr 95px;gap:10px;align-items:center;font-size:12px}.bar-track{height:9px;background:#edf2ef;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--green2);border-radius:99px}.report-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.report-tile{border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;gap:11px;align-items:flex-start}.report-tile .ri{width:38px;height:38px;border-radius:10px;background:#fff2d7;display:grid;place-items:center;color:#916d17;font-size:18px}.report-tile strong{display:block}.report-tile p{font-size:12px;color:var(--muted);margin:4px 0 9px}.modal-backdrop{position:fixed;inset:0;background:#0a211bcc;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(780px,100%);max-height:92vh;overflow:auto;background:white;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0;font-size:20px}.modal-close{background:#f1f4f2;font-size:20px;padding:5px 10px}.file-drop{border:1px dashed #a8bdb2;background:#f8fbf9;padding:16px;border-radius:10px}.footer{font-size:11px;color:#82928b;text-align:center;padding:22px}.mobile-menu{display:none}.mini{font-size:11px}.split{display:flex;justify-content:space-between;gap:10px;align-items:center}.checkline{display:flex;gap:8px;align-items:center}.checkline input{width:auto;min-height:auto}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.report-list{grid-template-columns:repeat(2,minmax(0,1fr))}.three-col{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;z-index:15;width:245px;transition:left .2s}.sidebar.open{left:0}.mobile-menu{display:inline-block}.topbar{padding:0 14px;height:64px}.topbar .left{gap:9px}.topbar p{display:none}.top-actions .hide-mobile{display:none}.content{padding:16px}.page-head{display:block}.page-head .actions{margin-top:12px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat strong{font-size:20px}.card{padding:14px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.report-list,.three-col{grid-template-columns:1fr}.bar-row{grid-template-columns:90px 1fr 75px}.brand{padding-bottom:13px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><img src="Kingdom_Treasure_logo.png" alt="Kingdom Treasure logo"><div><strong>Kingdom Treasure</strong><span>CHURCH MANAGEMENT</span></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
    <button data-page="transactions"><span class="ico">↔</span> Income & Expenses</button>
    <button data-page="pledges"><span class="ico">♡</span> Pledges</button>
    <button data-page="claims"><span class="ico">▤</span> Payables & Reimbursements</button>
    <button data-page="assets"><span class="ico">◇</span> Assets & Inventory</button>
    <button data-page="fundraising"><span class="ico">◎</span> Fundraising & Resale</button>
    <button data-page="reports"><span class="ico">▥</span> Reports & Statements</button>
    <button data-page="import"><span class="ico">⇧</span> Excel Import / Export</button>
    <button data-page="settings"><span class="ico">⚙</span> Church Settings</button>
  </nav>
  <div class="sidebar-foot">Faithful Stewardship.<br>Transparent Accounting.<br><br>© Kingdom Treasure</div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="left"><button class="secondary mobile-menu" id="menuBtn">☰</button><div><h1 id="topTitle">Dashboard</h1><p id="topSubtitle">Your church's financial overview</p></div></div>
    <div class="top-actions"><button class="outline hide-mobile" id="quickImport">⇧ Import Excel</button><button class="primary" id="quickAdd">＋ Record transaction</button></div>
  </header>
  <div class="content" id="content"></div>
  <div class="footer">Kingdom Treasure Church Management Software · Faithful Stewardship. Transparent Accounting.</div>
</main>
</div>
<div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=(n,c='EUR')=>{let v=Number(n||0);try{return new Intl.NumberFormat('en-GB',{style:'currency',currency:c,maximumFractionDigits:2}).format(v)}catch{return c+' '+v.toFixed(2)}};
const num=v=>Number(v||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultSettings={name:'Kingdom Treasure Demo Church',address:'Church address',phone:'',email:'',currency:'EUR',currencyList:'EUR,USD,ZAR,GBP,ZiG,ZWL',financialYearStart:'01-01'};
let settings=Object.assign({},defaultSettings,JSON.parse(localStorage.getItem('kt_settings')||'{}'));
let transactions=JSON.parse(localStorage.getItem('kt_transactions')||'[]');
let pledges=JSON.parse(localStorage.getItem('kt_pledges')||'[]');
let claims=JSON.parse(localStorage.getItem('kt_claims')||'[]');
let assets=JSON.parse(localStorage.getItem('kt_assets')||'[]');
let campaigns=JSON.parse(localStorage.getItem('kt_campaigns')||'[]');
let page='dashboard', modalKind=null;
function save(){localStorage.setItem('kt_settings',JSON.stringify(settings));localStorage.setItem('kt_transactions',JSON.stringify(transactions));localStorage.setItem('kt_pledges',JSON.stringify(pledges));localStorage.setItem('kt_claims',JSON.stringify(claims));localStorage.setItem('kt_assets',JSON.stringify(assets));localStorage.setItem('kt_campaigns',JSON.stringify(campaigns))}
function txPosted(t){return t.status!=='Pending'&&t.status!=='Cancelled'&&t.status!=='Rejected'}
function amountBase(t){return num(t.baseAmount!==undefined?t.baseAmount:t.amount)}
function inPeriod(date,from,to){return (!from||date>=from)&&(!to||date<=to)}
function allTransactions(){return transactions.filter(txPosted)}
function incomeRows(from='',to=''){return allTransactions().filter(t=>t.direction==='Income'&&inPeriod(t.date,from,to))}
function expenseRows(from='',to=''){return allTransactions().filter(t=>t.direction==='Expense'&&!t.settlement&&inPeriod(t.date,from,to))}
function sum(rows){return rows.reduce((a,t)=>a+amountBase(t),0)}
function cashBalance(){return allTransactions().filter(t=>t.paymentStatus!=='Unpaid'&&t.method!=='Accrued payable').reduce((a,t)=>a+(t.direction==='Income'?1:-1)*amountBase(t),0)}
function payableBalance(){let claimRefs=new Set(claims.map(c=>'PAY-'+c.id));return claims.filter(c=>c.status==='Approved'||c.status==='Partially Paid').reduce((a,c)=>a+Math.max(0,num(c.amount)-num(c.paid)),0)+transactions.filter(t=>t.direction==='Expense'&&t.paymentStatus==='Unpaid'&&txPosted(t)&&!claimRefs.has(t.reference)).reduce((a,t)=>a+amountBase(t),0)}
function pageMeta(p){return {dashboard:['Dashboard',"Your church's financial overview"],transactions:['Income & Expenses','Record and manage church financial transactions'],pledges:['Pledges','Track commitments and payment progress'],claims:['Payables & Reimbursements','Manage invoices, debts and receipt-backed claims'],assets:['Assets & Inventory','Track church assets, donated goods and stock for resale'],fundraising:['Fundraising & Resale','Monitor campaigns, sales and project proceeds'],reports:['Reports & Statements','Generate period-based reports and financial statements'],import:['Excel Import / Export','Import historical records and export data safely'],settings:['Church Settings','Configure church identity, reporting currency and periods']}[p]}
function go(p){page=p;$('#sidebar').classList.remove('open');$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let m=pageMeta(p);$('#topTitle').textContent=m[0];$('#topSubtitle').textContent=m[1];render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#quickAdd').onclick=()=>openTxModal();
$('#quickImport').onclick=()=>go('import');
function render(){if(page==='dashboard')renderDashboard();if(page==='transactions')renderTransactions();if(page==='pledges')renderPledges();if(page==='claims')renderClaims();if(page==='assets')renderAssets();if(page==='fundraising')renderFundraising();if(page==='reports')renderReports();if(page==='import')renderImport();if(page==='settings')renderSettings()}
function pageHead(title,desc,buttons=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
function cardStat(icon,label,value,sub,color=''){return `<div class="card stat"><div class="stat-icon" style="${color?`background:${color}`:''}">${icon}</div><div><label>${label}</label><strong>${value}</strong><small>${sub||''}</small></div></div>`}
function renderDashboard(){
let ins=incomeRows(),outs=expenseRows(),inc=sum(ins),exp=sum(outs),net=inc-exp,cur=settings.currency;
let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setMonth(d.getMonth()-5+i);return {key:d.toISOString().slice(0,7),label:d.toLocaleDateString('en',{month:'short'})}});
let max=Math.max(1,...months.flatMap(m=>[sum(ins.filter(t=>t.date.startsWith(m.key))),sum(outs.filter(t=>t.date.startsWith(m.key)))]));
let bars=months.map(m=>{let a=sum(ins.filter(t=>t.date.startsWith(m.key))),b=sum(outs.filter(t=>t.date.startsWith(m.key)));return `<div class="bar-row"><span>${m.label}</span><div style="display:flex;gap:4px"><div class="bar-track" style="flex:1"><div class="bar-fill" style="width:${a/max*100}%"></div></div><div class="bar-track" style="flex:1"><div class="bar-fill" style="width:${b/max*100}%;background:#d7a64b"></div></div></div><span class="right">${fmt(a-b,cur)}</span></div>`}).join('');
let recent=allTransactions().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
$('#content').innerHTML=pageHead('Financial dashboard','Welcome to '+esc(settings.name)+'.',`<button class="primary" onclick="openTxModal('Income')">＋ Record income</button><button class="outline" onclick="openTxModal('Expense')">− Record expense</button>`)+
`<div class="grid stats">${cardStat('↙','Total income',fmt(inc,cur),ins.length+' posted receipts')}${cardStat('↗','Total expenses',fmt(exp,cur),outs.length+' posted expenses','#fff0e8')}${cardStat('▣','Net movement',fmt(net,cur),'Income less expenses','#eef2ff')}${cardStat('◷','Outstanding payables',fmt(payableBalance(),cur),'Approved claims and unpaid bills','#fff5d9')}</div>
<div class="grid two-col"><section class="card"><h3 class="section-title">Income vs expenses · last 6 months</h3><div class="bar-list">${bars}</div><p class="muted mini">Bars show monthly posted income (green) and expenses (gold). All figures use the reporting-currency equivalent stored per transaction.</p></section>
<section class="card"><h3 class="section-title">Quick actions</h3><div class="grid three-col">
<button class="secondary" onclick="openTxModal('Income')">＋<br>Income</button><button class="secondary" onclick="openTxModal('Expense')">＋<br>Expense</button><button class="secondary" onclick="openPledgeModal()">♡<br>Pledge</button><button class="secondary" onclick="openClaimModal()">▤<br>Reimbursement</button><button class="secondary" onclick="openAssetModal()">◇<br>Asset / Gift</button><button class="secondary" onclick="go('reports')">▥<br>Reports</button></div><hr style="border:0;border-top:1px solid var(--line);margin:17px 0"><div class="split"><span class="muted">Pending pledges</span><strong>${fmt(pledges.filter(p=>p.status==='Pending').reduce((a,p)=>a+Math.max(0,num(p.amount)-num(p.paid)),0),cur)}</strong></div><div class="split" style="margin-top:10px"><span class="muted">Pending claim review</span><strong>${claims.filter(c=>c.status==='Pending Review').length}</strong></div><div class="split" style="margin-top:10px"><span class="muted">Assets / inventory records</span><strong>${assets.length}</strong></div></section></div>
<section class="card" style="margin-top:15px"><div class="split"><h3 class="section-title">Recent transactions</h3><button class="outline small" onclick="go('transactions')">View all →</button></div>${transactionTable(recent)}</section>
<div class="notice" style="margin-top:15px"><strong>Prototype storage notice:</strong> This version saves records in this browser only. Use a trusted device, export regular backups and do not treat browser storage as a shared or secure production database.</div>`;
}
function transactionTable(rows){if(!rows.length)return '<div class="empty">No transactions yet. Select “Record transaction” to add the first entry.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Method / account</th><th>Status</th><th class="right">Amount</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.date)}</td><td><span class="pill ${t.direction==='Income'?'paid':'pending'}">${esc(t.direction)}</span></td><td>${esc(t.category)}</td><td>${esc(t.description||'—')}</td><td>${esc(t.method||'—')} · ${esc(t.currency||settings.currency)}</td><td><span class="pill ${String(t.status||'Posted').toLowerCase().replaceAll(' ','-')}">${esc(t.status||'Posted')}</span></td><td class="right">${fmt(t.amount,t.currency||settings.currency)}</td><td><button class="outline small" onclick="deleteRecord('transactions','${t.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function renderTransactions(){
$('#content').innerHTML=pageHead('Income & Expenses','All receipts, payments, payment methods and currencies.',`<button class="primary" onclick="openTxModal()">＋ Add transaction</button><button class="outline" onclick="exportWorkbook('transactions')">Export Excel</button>`)+
`<div class="card"><div class="toolbar"><input id="txSearch" placeholder="Search description, category, reference..." oninput="filterTxTable()" style="flex:1;min-width:190px"><select id="txDir" onchange="filterTxTable()"><option value="">All types</option><option>Income</option><option>Expense</option></select><select id="txCat" onchange="filterTxTable()"><option value="">All categories</option>${[...new Set(transactions.map(t=>t.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><input type="date" id="txFrom" onchange="filterTxTable()"><input type="date" id="txTo" onchange="filterTxTable()"></div><div id="txTable">${transactionTable(transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</div></div>`;
}
function filterTxTable(){let s=($('#txSearch')?.value||'').toLowerCase(),d=$('#txDir')?.value||'',c=$('#txCat')?.value||'',f=$('#txFrom')?.value||'',t=$('#txTo')?.value||'';let rows=transactions.filter(x=>(!d||x.direction===d)&&(!c||x.category===c)&&(!f||x.date>=f)&&(!t||x.date<=t)&&[x.description,x.category,x.reference,x.name,x.method].join(' ').toLowerCase().includes(s)).sort((a,b)=>b.date.localeCompare(a.date));$('#txTable').innerHTML=transactionTable(rows)}
function openTxModal(direction='Income',record=null){
modalKind='tx';let r=record||{};let catsIn=['Tithes','Partnerships','Thanksgiving Offering','General Offering','Love Offering Received','Fundraising Donation','Other Income','Sale of Items','Gift in Kind'];let catsOut=['Pastor Salary','Worker / Musician Payment','Guest Minister Love Offering','Supplier / Purchases','Rent','Utilities','Transport','Church Activities','Fundraising Costs','Inventory Purchase','Asset Purchase','Other Expense'];let cats=[...new Set([...catsIn,...catsOut,'Custom'])];
showModal('Record financial transaction',`<form id="txForm"><div class="form-grid">
<div class="field"><label>Transaction type *</label><select name="direction" id="txDirection" required onchange="updateTxCats()"><option ${direction==='Income'?'selected':''}>Income</option><option ${direction==='Expense'?'selected':''}>Expense</option></select></div>
<div class="field"><label>Date *</label><input type="date" name="date" value="${esc(r.date||today())}" required></div>
<div class="field"><label>Category *</label><select name="category" id="txCategory" required>${cats.map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="field"><label>Amount *</label><input name="amount" type="number" min="0.01" step="0.01" required value="${esc(r.amount||'')}" placeholder="0.00"></div>
<div class="field"><label>Currency *</label><select name="currency">${currencyOptions(r.currency||settings.currency)}</select></div>
<div class="field"><label>Payment method *</label><select name="method" required>${['Cash','Bank Transfer','Mobile Money','Card','Cheque','In-kind','Other'].map(x=>`<option ${r.method===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Cash / bank / mobile account</label><input name="account" value="${esc(r.account||'')}" placeholder="e.g. Main Bank, Cash Box, EcoCash"></div>
<div class="field"><label>Payment status</label><select name="paymentStatus"><option ${r.paymentStatus==='Paid'||!r.paymentStatus?'selected':''}>Paid</option><option ${r.paymentStatus==='Unpaid'?'selected':''}>Unpaid</option><option ${r.paymentStatus==='Partially Paid'?'selected':''}>Partially Paid</option></select></div>
<div class="field"><label>Person / supplier / donor</label><input name="name" value="${esc(r.name||'')}" placeholder="Optional"></div>
<div class="field"><label>Reference number</label><input name="reference" value="${esc(r.reference||'')}" placeholder="Receipt, transfer or invoice number"></div>
<div class="field span2"><label>Description / occasion</label><input name="description" value="${esc(r.description||'')}" placeholder="e.g. Sunday service offering, October salary"></div>
<div class="field"><label>Service / event type</label><select name="eventType">${['Not applicable','Sunday Service','Prayer Meeting','Conference','Special Service','Fundraising','Other Gathering'].map(x=>`<option ${r.eventType===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Fund / project</label><input name="fund" value="${esc(r.fund||'General Fund')}" placeholder="General Fund, Building Fund..."></div>

}
function updateTxCats(){let dir=$('#txDirection').value;let c=dir==='Income'?['Tithes','Partnerships','Thanksgiving Offering','General Offering','Love Offering Received','Fundraising Donation','Other Income','Sale of Items','Gift in Kind','Custom']:['Pastor Salary','Worker / Musician Payment','Guest Minister Love Offering','Supplier / Purchases','Rent','Utilities','Transport','Church Activities','Fundraising Costs','Inventory Purchase','Asset Purchase','Other Expense','Custom'];$('#txCategory').innerHTML=c.map(x=>`<option>${x}</option>`).join('')}
function currencyOptions(selected){let arr=[...new Set((settings.currencyList||'EUR,USD,ZAR,GBP').split(',').map(x=>x.trim()).filter(Boolean))];if(!arr.includes(selected))arr.unshift(selected);return arr.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function renderPledges(){let total=pledges.reduce((a,p)=>a+num(p.amount),0),paid=pledges.reduce((a,p)=>a+num(p.paid),0);$('#content').innerHTML=pageHead('Pledges','Manage commitments, expected dates, instalments and cancellations.',`<button class="primary" onclick="openPledgeModal()">＋ Add pledge</button><button class="outline" onclick="exportWorkbook('pledges')">Export Excel</button>`)+`<div class="grid stats">${cardStat('♡','Total pledged',fmt(total,settings.currency),'All commitments')}${cardStat('✓','Paid to date',fmt(paid,settings.currency),'Recorded fulfilment')}${cardStat('◷','Outstanding',fmt(Math.max(0,total-paid),settings.currency),'Not yet received')}${cardStat('!','Pending pledges',pledges.filter(p=>p.status==='Pending').length,'Commitments awaiting fulfilment')}</div><div class="card">${pledgeTable(pledges)}</div>`}
function pledgeTable(rows){if(!rows.length)return '<div class="empty">No pledges recorded yet.</div>';return `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Date pledged</th><th>Expected date</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.date)}</td><td>${esc(p.expected||'—')}</td><td>${fmt(p.amount,p.currency||settings.currency)}</td><td>${fmt(p.paid,p.currency||settings.currency)}</td><td>${fmt(Math.max(0,num(p.amount)-num(p.paid)),p.currency||settings.currency)}</td><td><span class="pill ${p.status.toLowerCase()}">${esc(p.status)}</span></td><td><button class="outline small" onclick="recordPledgePayment('${p.id}')">Payment</button> <button class="outline small" onclick="deleteRecord('pledges','${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function openPledgeModal(r=null){r=r||{};showModal('Add pledge',`<form id="pledgeForm"><div class="form-grid"><div class="field"><label>Name / donor *</label><input name="name" required value="${esc(r.name||'')}"></div><div class="field"><label>Amount pledged *</label><input name="amount" type="number" min=".01" step=".01" required value="${esc(r.amount||'')}"></div><div class="field"><label>Date pledged</label><input name="date" type="date" value="${esc(r.date||today())}" required></div><div class="field"><label>Expected date</label><input name="expected" type="date" value="${esc(r.expected||'')}"></div><div class="field"><label>Currency</label><select name="currency">${currencyOptions(r.currency||settings.currency)}</select></div><div class="field"><label>Status</label><select name="status">${['Pending','Paid','Cancelled'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field span2"><label>Purpose / notes</label><input name="purpose" value="${esc(r.purpose||'')}" placeholder="Building fund, missions..."></div></div><div class="actions"><button type="button" class="outline" onclick="closeModal()">Cancel</button><button class="primary">Save pledge</button></div></form>`);
$('#pledgeForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let p={id:r.id||uid(),...d,amount:num(d.amount),paid:num(r.paid),createdAt:new Date().toISOString()};if(p.paid>=p.amount&&p.status!=='Cancelled')p.status='Paid';pledges.unshift(p);save();closeModal();render()}}
function recordPledgePayment(id){let p=pledges.find(x=>x.id===id);if(!p)return;let v=prompt(`Enter payment amount. Outstanding: ${fmt(Math.max(0,num(p.amount)-num(p.paid)),p.currency||settings.currency)}`);if(v===null)return;let n=num(v);if(n<=0||n>num(p.amount)-num(p.paid))return alert('Enter a valid amount not exceeding the outstanding balance.');p.paid=num(p.paid)+n;if(p.paid>=num(p.amount))p.status='Paid';transactions.unshift({id:uid(),direction:'Income',date:today(),category:'Pledge Payment',amount:n,currency:p.currency||settings.currency,rate:1,baseAmount:n,method:'Other',account:'',paymentStatus:'Paid',name:p.name,description:'Pledge payment: '+(p.purpose||p.name),reference:'PLEDGE-'+p.id,status:'Posted',fund:p.purpose||'General Fund'});save();render()}
function renderClaims(){let due=payableBalance();$('#content').innerHTML=pageHead('Payables & Reimbursements','Record unpaid invoices, upload receipts and reimburse people who used personal funds.',`<button class="primary" onclick="openClaimModal()">＋ New claim / payable</button><button class="outline" onclick="exportWorkbook('claims')">Export Excel</button>`)+`<div class="grid stats">${cardStat('◷','Total outstanding',fmt(due,settings.currency),'Approved payables')}${cardStat('▤','Awaiting review',claims.filter(c=>c.status==='Pending Review').length,'Claims not yet approved')}${cardStat('✓','Approved claims',claims.filter(c=>c.status==='Approved'||c.status==='Partially Paid').length,'Awaiting full settlement')}${cardStat('↗','Paid claims',claims.filter(c=>c.status==='Paid').length,'Fully reimbursed')}</div><div class="card">${claimTable(claims)}</div>`}
function claimTable(rows){if(!rows.length)return '<div class="empty">No payables or reimbursement claims yet.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Claimant / supplier</th><th>Purpose</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Receipt</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(c.name)}</td><td>${esc(c.purpose)}</td><td>${fmt(c.amount,c.currency||settings.currency)}</td><td>${fmt(c.paid,c.currency||settings.currency)}</td><td>${fmt(Math.max(0,num(c.amount)-num(c.paid)),c.currency||settings.currency)}</td><td>${c.receiptData?'<span class="pill paid">Attached</span>':esc(c.receiptName||'—')}</td><td><span class="pill ${c.status.toLowerCase().replaceAll(' ','-')}">${esc(c.status)}</span></td><td>${c.status==='Pending Review'?`<button class="outline small" onclick="approveClaim('${c.id}')">Review</button>`:''}${c.status==='Approved'||c.status==='Partially Paid'?` <button class="primary small" onclick="payClaim('${c.id}')">Pay</button>`:''} <button class="outline small" onclick="deleteRecord('claims','${c.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function openClaimModal(){showModal('New payable / reimbursement claim',`<form id="claimForm"><div class="form-grid"><div class="field"><label>Claim type *</label><select name="type"><option>Reimbursement</option><option>Supplier invoice</option><option>Salary owed</option><option>Other payable</option></select></div><div class="field"><label>Claimant / supplier *</label><input name="name" required></div><div class="field"><label>Expense date *</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Amount *</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Currency</label><select name="currency">${currencyOptions(settings.currency)}</select></div><div class="field"><label>Original payment method</label><select name="originalMethod"><option>Personal Cash</option><option>Personal Bank Transfer</option><option>Personal Mobile Money</option><option>Personal Card</option><option>Not applicable - supplier invoice</option><option>Other</option></select></div><div class="field span2"><label>Purpose / expense category *</label><input name="purpose" required placeholder="e.g. Transport for outreach, stationery"></div><div class="field"><label>Receipt / invoice file *</label><input type="file" name="receipt" accept="image/*,.pdf" required></div><div class="field"><label>Due date</label><input name="due" type="date"></div><div class="field span2"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="notice">The attachment is saved in this browser's local storage in this prototype. Production use should store files in protected server-side storage.</div><div class="actions"><button type="button" class="outline" onclick="closeModal()">Cancel</button><button class="primary">Submit for review</button></div></form>`);
$('#claimForm').onsubmit=async e=>{e.preventDefault();let form=e.target,d=Object.fromEntries(new FormData(form)),file=form.receipt.files[0];let data='';if(file){if(file.size>2*1024*1024)return alert('For this browser prototype, please use a file smaller than 2 MB.');data=await fileToDataURL(file)}let c={id:uid(),...d,amount:num(d.amount),paid:0,status:'Pending Review',receiptName:file?.name||'',receiptData:data};delete c.receipt;claims.unshift(c);save();closeModal();render()}}
function fileToDataURL(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function approveClaim(id){let c=claims.find(x=>x.id===id);if(!c)return;if(!confirm(`Approve ${c.type} for ${c.name}, ${fmt(c.amount,c.currency)}?`))return;c.status='Approved';if(c.type==='Reimbursement'||c.type==='Supplier invoice'||c.type==='Salary owed'||c.type==='Other payable'){transactions.unshift({id:uid(),direction:'Expense',date:c.date,category:c.purpose,amount:c.amount,currency:c.currency||settings.currency,rate:1,baseAmount:c.amount,method:'Accrued payable',account:'Accounts Payable',paymentStatus:'Unpaid',name:c.name,description:c.type+': '+c.purpose,reference:'PAY-'+c.id,status:'Posted',fund:'General Fund'});}save();render()}
function payClaim(id){let c=claims.find(x=>x.id===id);if(!c)return;let remaining=num(c.amount)-num(c.paid);let amt=prompt(`Amount to pay. Outstanding: ${fmt(remaining,c.currency||settings.currency)}`,String(remaining));if(amt===null)return;amt=num(amt);if(amt<=0||amt>remaining)return alert('Enter a valid amount not exceeding the outstanding balance.');let method=prompt('Payment method: Cash, Bank Transfer, Mobile Money, Card', 'Bank Transfer');if(!method)return;c.paid=num(c.paid)+amt;c.status=c.paid>=num(c.amount)?'Paid':'Partially Paid';transactions.unshift({id:uid(),direction:'Expense',date:today(),category:c.purpose,amount:amt,currency:c.currency||settings.currency,rate:1,baseAmount:amt,method,account:'',paymentStatus:'Paid',name:c.name,description:'Settlement: '+c.purpose,reference:'SET-'+c.id,status:'Posted',fund:'General Fund',settlement:true});save();render()}
function renderAssets(){let total=assets.reduce((a,x)=>a+num(x.value),0);$('#content').innerHTML=pageHead('Assets & Inventory','Record church assets, gifts in kind and items held for resale.',`<button class="primary" onclick="openAssetModal()">＋ Add asset / item</button><button class="outline" onclick="exportWorkbook('assets')">Export Excel</button>`)+`<div class="grid stats">${cardStat('◇','Total recorded value',fmt(total,settings.currency),'Recorded values; mixed asset types')}${cardStat('▣','Fixed assets',assets.filter(a=>a.type==='Fixed Asset').length,'Equipment and long-term property')}${cardStat('♡','Gifts in kind',assets.filter(a=>a.type==='Gift in Kind').length,'Non-cash donations')}${cardStat('▤','Resale inventory',assets.filter(a=>a.type==='Inventory for Resale').length,'Stock items')}</div><div class="card">${assetTable(assets)}</div>`}
function assetTable(rows){if(!rows.length)return '<div class="empty">No assets or inventory records yet.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Item</th><th>Description</th><th>Type</th><th>Quantity</th><th>Value each</th><th>Total value</th><th>Location / custodian</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.name)}</td><td>${esc(a.description||'')}</td><td>${esc(a.type)}</td><td>${esc(a.quantity)}</td><td>${fmt(a.value,a.currency||settings.currency)}</td><td>${fmt(num(a.value)*num(a.quantity),a.currency||settings.currency)}</td><td>${esc(a.location||a.custodian||'—')}</td><td><button class="outline small" onclick="deleteRecord('assets','${a.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function openAssetModal(){showModal('Add asset, gift in kind or inventory',`<form id="assetForm"><div class="form-grid"><div class="field"><label>Item name *</label><input name="name" required></div><div class="field"><label>Record type *</label><select name="type">${['Fixed Asset','Gift in Kind','Inventory for Resale','Consumable','Other Asset'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Date acquired / received *</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Quantity *</label><input name="quantity" type="number" min=".01" step=".01" value="1" required></div><div class="field"><label>Value per item *</label><input name="value" type="number" min="0" step=".01" required></div><div class="field"><label>Currency</label><select name="currency">${currencyOptions(settings.currency)}</select></div><div class="field"><label>Donor / supplier</label><input name="source"></div><div class="field"><label>Location / custodian</label><input name="location"></div><div class="field span2"><label>Description / valuation method</label><textarea name="description" placeholder="Condition, market estimate, receipt reference, useful life..."></textarea></div></div><div class="actions"><button type="button" class="outline" onclick="closeModal()">Cancel</button><button class="primary">Save record</button></div></form>`);$('#assetForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.id=uid();d.quantity=num(d.quantity);d.value=num(d.value);assets.unshift(d);save();closeModal();render()}}
function renderFundraising(){let total=campaigns.reduce((a,c)=>a+num(c.income),0),cost=campaigns.reduce((a,c)=>a+num(c.expenses),0);$('#content').innerHTML=pageHead('Fundraising & Resale','Manage campaigns, event costs and merchandise sales.',`<button class="primary" onclick="openCampaignModal()">＋ New activity</button><button class="outline" onclick="exportWorkbook('campaigns')">Export Excel</button>`)+`<div class="grid stats">${cardStat('◎','Campaign income',fmt(total,settings.currency),'Recorded activity receipts')}${cardStat('↗','Campaign costs',fmt(cost,settings.currency),'Recorded activity expenses')}${cardStat('✓','Net proceeds',fmt(total-cost,settings.currency),'Income less costs')}${cardStat('▤','Activities',campaigns.length,'Campaigns and resale activities')}</div><div class="card">${campaignTable(campaigns)}</div><div class="notice" style="margin-top:14px">This module tracks campaign summaries. To ensure complete financial statements, enter each actual receipt and expense in Income & Expenses as well. Inventory sales and cost of goods sold need accounting entries before relying on reports for formal accounts.</div>`}
function campaignTable(rows){if(!rows.length)return '<div class="empty">No fundraising activities recorded.</div>';return `<div class="table-wrap"><table><thead><tr><th>Activity</th><th>Type</th><th>Start</th><th>Target</th><th>Income</th><th>Expenses</th><th>Net</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.type)}</td><td>${esc(c.date)}</td><td>${fmt(c.target,c.currency||settings.currency)}</td><td>${fmt(c.income,c.currency||settings.currency)}</td><td>${fmt(c.expenses,c.currency||settings.currency)}</td><td>${fmt(num(c.income)-num(c.expenses),c.currency||settings.currency)}</td><td><span class="pill">${esc(c.status)}</span></td><td><button class="outline small" onclick="deleteRecord('campaigns','${c.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function openCampaignModal(){showModal('New fundraising / resale activity',`<form id="campaignForm"><div class="form-grid"><div class="field"><label>Activity name *</label><input name="name" required></div><div class="field"><label>Type</label><select name="type"><option>Fundraising Campaign</option><option>Conference</option><option>Item Resale</option><option>Food Sale</option><option>Other</option></select></div><div class="field"><label>Start date</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>Target</label><input type="number" name="target" min="0" step=".01" value="0"></div><div class="field"><label>Income received</label><input type="number" name="income" min="0" step=".01" value="0"></div><div class="field"><label>Expenses incurred</label><input type="number" name="expenses" min="0" step=".01" value="0"></div><div class="field"><label>Currency</label><select name="currency">${currencyOptions(settings.currency)}</select></div><div class="field"><label>Status</label><select name="status"><option>Active</option><option>Completed</option><option>On Hold</option></select></div></div><div class="actions"><button type="button" class="outline" onclick="closeModal()">Cancel</button><button class="primary">Save activity</button></div></form>`);$('#campaignForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.id=uid();['target','income','expenses'].forEach(k=>d[k]=num(d[k]));campaigns.unshift(d);save();closeModal();render()}}
function periodControls(){let start=new Date();start.setMonth(start.getMonth(),1);let from=new Date().getFullYear()+'-01-01';return `<div class="toolbar"><label class="mini">From <input type="date" id="reportFrom" value="${from}"></label><label class="mini">To <input type="date" id="reportTo" value="${today()}"></label><button class="secondary" onclick="refreshReport()">Apply period</button><select id="periodPreset" onchange="setPreset(this.value)"><option value="">Custom period</option><option value="month">This month</option><option value="quarter">This quarter</option><option value="year">This financial year</option><option value="lastyear">Previous calendar year</option><option value="all">All periods</option></select></div>`}
function renderReports(){let from=new Date().getFullYear()+'-01-01',to=today();$('#content').innerHTML=pageHead('Reports & Statements','Generate downloadable financial reports for any period.',`<button class="outline" onclick="exportWorkbook('all')">Export all data to Excel</button>`)+`<div class="card"><h3 class="section-title">Reporting period</h3>${periodControls()}<div class="notice">Choose a period, then generate a statement. PDF reports include the Kingdom Treasure logo and church details configured in Settings. Excel exports contain transaction and supporting registers.</div><div id="reportOutput"></div></div><div class="card" style="margin-top:15px"><h3 class="section-title">Available reports</h3><div class="report-list">
${reportTile('▥','Income Statement','Income and expenses for a selected period','income')}${reportTile('▤','Balance Sheet','Assets, liabilities and net assets as at a date','balance')}${reportTile('↔','Cash Flow Statement','Cash receipts and payments during a period','cashflow')}${reportTile('♡','Pledge Register','Pledges, payments and outstanding balances','pledges')}${reportTile('▤','Payables & Reimbursements','Approved claims, supplier debts and balances','claims')}${reportTile('◇','Asset & Inventory Register','Fixed assets, donated goods and resale stock','assets')}${reportTile('◎','Fundraising Summary','Campaign income, costs and net proceeds','campaigns')}${reportTile('↕','Income & Expense Details','Full transaction list for a selected period','transactions')}${reportTile('✓','Trial Balance','Debit and credit totals from simplified posting data','trial')}</div></div>`;
refreshReport()}
function reportTile(icon,title,desc,type){return `<div class="report-tile"><div class="ri">${icon}</div><div><strong>${title}</strong><p>${desc}</p><div class="actions"><button class="secondary small" onclick="generateReport('${type}')">Preview</button><button class="outline small" onclick="downloadPDF('${type}')">PDF</button><button class="outline small" onclick="exportWorkbook('${type}')">Excel</button></div></div></div>`}
function setPreset(v){let now=new Date(),from,to=today();if(v==='month'){from=new Date(now.getFullYear(),now.getMonth(),1)}else if(v==='quarter'){from=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1)}else if(v==='year'){from=new Date(now.getFullYear(),0,1)}else if(v==='lastyear'){from=new Date(now.getFullYear()-1,0,1);to=new Date(now.getFullYear()-1,11,31).toISOString().slice(0,10)}else if(v==='all'){from=null;to=null}else return;$('#reportFrom').value=from?from.toISOString().slice(0,10):'';$('#reportTo').value=to||'';refreshReport()}
function refreshReport(){if(!$('#reportOutput'))return;let f=$('#reportFrom').value,t=$('#reportTo').value;let inc=incomeRows(f,t),exp=expenseRows(f,t);$('#reportOutput').innerHTML=`<div class="grid stats" style="margin-top:12px">${cardStat('↙','Income',fmt(sum(inc),settings.currency),`${inc.length} transactions`)}${cardStat('↗','Expenses',fmt(sum(exp),settings.currency),`${exp.length} transactions`)}${cardStat('✓','Surplus / deficit',fmt(sum(inc)-sum(exp),settings.currency),'Selected period')}${cardStat('◷','Payables',fmt(payableBalance(),settings.currency),'Current outstanding balance')}</div>`}
function reportData(type,from,to){let ins=incomeRows(from,to),exs=expenseRows(from,to),tx=allTransactions().filter(x=>inPeriod(x.date,from,to));if(type==='income')return {title:'Income Statement',headers:['Category','Amount'],rows:[...groupSums(ins).map(x=>['Income: '+x[0],fmt(x[1],settings.currency)]),['TOTAL INCOME',fmt(sum(ins),settings.currency)],...groupSums(exs).map(x=>['Expense: '+x[0],fmt(x[1],settings.currency)]),['TOTAL EXPENSES',fmt(sum(exs),settings.currency)],['SURPLUS / (DEFICIT)',fmt(sum(ins)-sum(exs),settings.currency)]]};
if(type==='balance'){let cash=cashBalance(),assetVal=assets.reduce((a,x)=>a+num(x.value)*num(x.quantity),0),pay=payableBalance(),net=cash+assetVal-pay;return {title:'Balance Sheet',headers:['Account','Amount'],rows:[['Cash movement balance (simplified)',fmt(cash,settings.currency)],['Recorded asset / inventory value',fmt(assetVal,settings.currency)],['TOTAL ASSETS (simplified)',fmt(cash+assetVal,settings.currency)],['Known outstanding payables',fmt(pay,settings.currency)],['Net assets / balancing figure (simplified)',fmt(net,settings.currency)],['Note','Opening balances and full double-entry ledger required for formal balance sheet']]}}
if(type==='cashflow'){let ci=sum(ins.filter(x=>x.paymentStatus!=='Unpaid')),directOut=sum(exs.filter(x=>x.paymentStatus!=='Unpaid')),settlements=allTransactions().filter(x=>x.direction==='Expense'&&x.settlement&&inPeriod(x.date,from,to)),co=directOut+sum(settlements);return {title:'Cash Flow Statement',headers:['Cash flow item','Amount'],rows:[['Cash receipts (recorded income)',fmt(ci,settings.currency)],['Cash payments (including payable settlements)',fmt(co,settings.currency)],['Net cash movement for period',fmt(ci-co,settings.currency)],['Opening cash balance','Enter / reconcile in accounting records'],['Closing cash balance','Reconcile to cashbook and bank statements']]}}
if(type==='pledges')return {title:'Pledge Register',headers:['Name','Date','Expected','Pledged','Paid','Outstanding','Status'],rows:pledges.map(p=>[p.name,p.date,p.expected,fmt(p.amount,p.currency),fmt(p.paid,p.currency),fmt(Math.max(0,num(p.amount)-num(p.paid)),p.currency),p.status])};
if(type==='claims')return {title:'Payables & Reimbursements',headers:['Date','Name','Type','Purpose','Amount','Paid','Balance','Status'],rows:claims.map(c=>[c.date,c.name,c.type,c.purpose,fmt(c.amount,c.currency),fmt(c.paid,c.currency),fmt(Math.max(0,num(c.amount)-num(c.paid)),c.currency),c.status])};
if(type==='assets')return {title:'Asset & Inventory Register',headers:['Date','Name','Type','Quantity','Value each','Total value','Source','Location'],rows:assets.map(a=>[a.date,a.name,a.type,a.quantity,fmt(a.value,a.currency),fmt(num(a.value)*num(a.quantity),a.currency),a.source,a.location])};
if(type==='campaigns')return {title:'Fundraising Summary',headers:['Activity','Type','Date','Target','Income','Expenses','Net','Status'],rows:campaigns.map(c=>[c.name,c.type,c.date,fmt(c.target,c.currency),fmt(c.income,c.currency),fmt(c.expenses,c.currency),fmt(num(c.income)-num(c.expenses),c.currency),c.status])};
if(type==='trial')return {title:'Trial Balance (Simplified)',headers:['Account','Debit','Credit'],rows:[['Total income',fmt(sum(ins),settings.currency),'—'],['Total expenses',fmt(sum(exs),settings.currency),'—'],['Warning','This is a category summary, not a validated double-entry trial balance','']]};
return {title:'Income & Expense Details',headers:['Date','Type','Category','Description','Name','Currency','Amount','Payment Method','Account','Reference','Status'],rows:tx.map(x=>[x.date,x.direction,x.category,x.description,x.name,x.currency,x.amount,x.method,x.account,x.reference,x.status])}}
function groupSums(rows){let m={};rows.forEach(x=>m[x.category]=(m[x.category]||0)+amountBase(x));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function generateReport(type){let f=$('#reportFrom')?.value||'',t=$('#reportTo')?.value||'',d=reportData(type,f,t);$('#reportOutput').innerHTML=`<h3 class="section-title" style="margin-top:20px">${esc(d.title)}</h3><div class="muted mini">${esc(settings.name)} · ${f||'Beginning'} to ${t||'Present'}</div><div class="table-wrap" style="margin-top:10px"><table><thead><tr>${d.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${d.headers.length}">No records for this report.</td></tr>`}</tbody></table></div>`}
function downloadPDF(type){let f=$('#reportFrom')?.value||'',t=$('#reportTo')?.value||'',d=reportData(type,f,t);if(!window.jspdf){alert('PDF library could not load. Check internet access and try again.');return}const {jsPDF}=window.jspdf;let pdf=new jsPDF({orientation:d.headers.length>7?'landscape':'portrait'});let logo=new Image();logo.onload=()=>{try{pdf.addImage(logo,'PNG',14,9,28,28)}catch{}pdf.setFontSize(16);pdf.setTextColor(6,63,53);pdf.text('KINGDOM TREASURE',47,17);pdf.setFontSize(9);pdf.setTextColor(70,90,80);pdf.text('CHURCH MANAGEMENT SOFTWARE',47,23);pdf.setFontSize(10);pdf.setTextColor(30,40,35);pdf.text(settings.name,47,29);pdf.setFontSize(9);pdf.text([settings.address,settings.phone,settings.email].filter(Boolean).join(' | '),47,34,{maxWidth:145});pdf.setFontSize(14);pdf.text(d.title,14,47);pdf.setFontSize(9);pdf.text(`Period: ${f||'Beginning'} to ${t||'Present'}   |   Generated: ${today()}`,14,53);pdf.autoTable({startY:59,head:[d.headers],body:d.rows,styles:{fontSize:8,cellPadding:2.5},headStyles:{fillColor:[6,63,53]},margin:{left:14,right:14}});let y=pdf.lastAutoTable.finalY+10;pdf.setFontSize(8);pdf.setTextColor(90);pdf.text('Faithful Stewardship. Transparent Accounting.',14,Math.min(y,285));pdf.save(fileSafe(settings.name)+'-'+fileSafe(d.title)+'-'+(f||'all')+'-to-'+(t||'present')+'.pdf')} ;logo.onerror=()=>{pdfWithoutLogo(d,f,t)};logo.src='Kingdom_Treasure_logo.png';function pdfWithoutLogo(d,f,t){pdf.setFontSize(16);pdf.text('KINGDOM TREASURE',14,17);pdf.setFontSize(10);pdf.text(settings.name,14,24);pdf.setFontSize(14);pdf.text(d.title,14,40);pdf.autoTable({startY:47,head:[d.headers],body:d.rows,styles:{fontSize:8},headStyles:{fillColor:[6,63,53]}});pdf.save(fileSafe(d.title)+'.pdf')}}
function fileSafe(s){return String(s||'report').replace(/[^a-z0-9_-]+/gi,'-').replace(/^-|-$/g,'')}
function renderImport(){$('#content').innerHTML=pageHead('Excel Import / Export','Import historical records and download backups of your church data.',`<button class="outline" onclick="downloadTemplate()">Download Excel template</button><button class="primary" onclick="exportWorkbook('all')">Export full backup</button>`)+`<div class="grid two-col"><section class="card"><h3 class="section-title">Import from Excel</h3><p class="muted">Upload an .xlsx, .xls or .csv file. Choose the type of records and preview the rows before importing.</p><div class="field"><label>Record type</label><select id="importType"><option value="transactions">Income & expenses</option><option value="pledges">Pledges</option><option value="claims">Payables / reimbursements (metadata only)</option><option value="assets">Assets & inventory</option><option value="campaigns">Fundraising activities</option></select></div><div class="field"><label>Excel or CSV file</label><input id="importFile" type="file" accept=".xlsx,.xls,.csv"></div><div class="actions"><button class="primary" onclick="previewImport()">Preview file</button></div><div id="importPreview" style="margin-top:15px"></div></section><section class="card"><h3 class="section-title">Export data</h3><p class="muted">Download the selected register or a complete workbook containing multiple worksheets.</p><div class="field"><label>Export dataset</label><select id="exportType"><option value="all">Complete backup workbook</option><option value="transactions">Income & expenses</option><option value="pledges">Pledges</option><option value="claims">Payables & reimbursements</option><option value="assets">Assets & inventory</option><option value="campaigns">Fundraising activities</option></select></div><button class="primary" onclick="exportWorkbook($('#exportType').value)">Download Excel workbook</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h4>Before importing</h4><ul class="muted"><li>Use the provided column headers.</li><li>Check dates, currencies and amounts before confirming.</li><li>Importing creates records; it does not automatically reconcile bank statements.</li><li>Keep an original copy of the file as a backup.</li></ul></section></div><div class="notice" style="margin-top:15px">Excel import and export require the XLSX library to load. The library is loaded from a public CDN in this version. PDF reports similarly use jsPDF. For a fully offline deployment, bundle these libraries locally.</div>`}
function rowsFor(type){if(type==='transactions')return transactions.map(({id,baseAmount,...x})=>({...x,baseAmount:baseAmount??x.amount}));if(type==='pledges')return pledges;if(type==='claims')return claims.map(({receiptData,...x})=>x);if(type==='assets')return assets;if(type==='campaigns')return campaigns;return []}
function exportWorkbook(type){if(!window.XLSX){alert('Excel library could not load. Check internet access and try again.');return}let wb=XLSX.utils.book_new();let add=(name,rows)=>{let data=rows.length?rows:[{Note:'No records'}];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),name.slice(0,31))};if(type==='all'){add('Church Details',[settings]);['transactions','pledges','claims','assets','campaigns'].forEach(k=>add(k[0].toUpperCase()+k.slice(1),rowsFor(k)))}else add(type,rowsFor(type));XLSX.writeFile(wb,'Kingdom-Treasure-'+type+'-'+today()+'.xlsx')}
function downloadTemplate(){if(!window.XLSX){alert('Excel library could not load.');return}let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{direction:'Income',date:today(),category:'General Offering',amount:100,currency:settings.currency,rate:1,method:'Cash',account:'Main Cash Box',paymentStatus:'Paid',name:'',reference:'',description:'Sunday Service Offering',eventType:'Sunday Service',fund:'General Fund',status:'Posted'}]),'transactions');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{name:'Sample Pledger',date:today(),expected:today(),amount:250,paid:0,currency:settings.currency,status:'Pending',purpose:'Building Fund'}]),'pledges');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{name:'Projector',type:'Fixed Asset',date:today(),quantity:1,value:500,currency:settings.currency,source:'Supplier',location:'Sanctuary',description:'Sample asset'}]),'assets');XLSX.writeFile(wb,'Kingdom-Treasure-Import-Template.xlsx')}
let importRows=[];
function previewImport(){let f=$('#importFile').files[0],type=$('#importType').value;if(!f)return alert('Choose an Excel or CSV file first.');if(!window.XLSX)return alert('Excel library could not load.');let reader=new FileReader();reader.onload=e=>{try{let wb=XLSX.read(e.target.result,{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]];importRows=XLSX.utils.sheet_to_json(sheet,{defval:''});$('#importPreview').innerHTML=`<div class="success-note">Found ${importRows.length} rows in sheet “${esc(wb.SheetNames[0])}”. Review the first rows, then confirm import.</div><div class="table-wrap"><table><thead><tr>${Object.keys(importRows[0]||{}).slice(0,7).map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${importRows.slice(0,5).map(r=>`<tr>${Object.keys(importRows[0]||{}).slice(0,7).map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="primary" style="margin-top:12px" onclick="confirmImport('${type}')">Confirm import ${importRows.length} rows</button>`}catch(err){alert('Could not read this file: '+err.message)}};reader.readAsArrayBuffer(f)}
function confirmImport(type){if(!importRows.length)return;if(!confirm(`Import ${importRows.length} rows into ${type}? Please check the preview first.`))return;let good=0;for(let r of importRows){try{let x={...r,id:uid()};if(type==='transactions'){x.direction=String(x.direction||'Income');if(!['Income','Expense'].includes(x.direction))continue;x.date=String(x.date||today()).slice(0,10);x.amount=num(x.amount);x.rate=num(x.rate||1);if(x.amount<=0)continue;x.currency=x.currency||settings.currency;x.baseAmount=x.amount*x.rate;x.status=x.status||'Posted';x.paymentStatus=x.paymentStatus||'Paid';transactions.push(x)}else if(type==='pledges'){x.amount=num(x.amount);x.paid=num(x.paid);if(!x.name||x.amount<0)continue;x.status=x.status||'Pending';x.currency=x.currency||settings.currency;pledges.push(x)}else if(type==='assets'){x.quantity=num(x.quantity||1);x.value=num(x.value);if(!x.name)continue;x.currency=x.currency||settings.currency;assets.push(x)}else if(type==='campaigns'){['target','income','expenses'].forEach(k=>x[k]=num(x[k]));if(!x.name)continue;x.currency=x.currency||settings.currency;campaigns.push(x)}else if(type==='claims'){x.amount=num(x.amount);x.paid=num(x.paid);if(!x.name||x.amount<0)continue;x.status=x.status||'Pending Review';claims.push(x)}good++}catch{}}save();alert(`Imported ${good} rows. Please review records and reconcile balances before using reports.`);importRows=[];go(type==='transactions'?'transactions':type)}
function renderSettings(){$('#content').innerHTML=pageHead('Church Settings','Set the church details printed on reports and configure currency options.',`<button class="primary" onclick="saveSettingsForm()">Save settings</button>`)+`<div class="grid two-col"><section class="card"><h3 class="section-title">Church identity</h3><div class="field"><label>Church / organisation name</label><input id="sName" value="${esc(settings.name)}"></div><div class="field"><label>Address</label><textarea id="sAddress">${esc(settings.address)}</textarea></div><div class="field"><label>Phone</label><input id="sPhone" value="${esc(settings.phone)}"></div><div class="field"><label>Email</label><input id="sEmail" type="email" value="${esc(settings.email)}"></div><div class="field"><label>Reporting currency</label><select id="sCurrency">${currencyOptions(settings.currency)}</select></div><div class="field"><label>Supported currencies (comma separated)</label><input id="sCurrencies" value="${esc(settings.currencyList)}"><small class="muted">Use currency codes, e.g. EUR,USD,ZAR,GBP,ZiG.</small></div><button class="primary" onclick="saveSettingsForm()">Save church details</button></section><section class="card"><h3 class="section-title">Logo & data safety</h3><img src="Kingdom_Treasure_logo.png" alt="Kingdom Treasure logo" style="width:190px;max-height:190px;object-fit:contain;background:#f7faf8;border-radius:12px;padding:8px"><p class="muted">The supplied Kingdom Treasure logo is used in the app and PDF reports.</p><div class="notice">This prototype stores data in the current browser's local storage. It has no multi-user sign-in, server database, encrypted cloud backup or role-based access enforcement. Do not use it as the sole record system for live church finances until a secure backend is implemented.</div><button class="outline" onclick="exportWorkbook('all')">Export full data backup</button> <button class="danger" onclick="resetAll()">Delete all local data</button></section></div>`}
function saveSettingsForm(){settings.name=$('#sName').value.trim()||defaultSettings.name;settings.address=$('#sAddress').value;settings.phone=$('#sPhone').value;settings.email=$('#sEmail').value;settings.currency=$('#sCurrency').value;settings.currencyList=$('#sCurrencies').value||settings.currency;save();alert('Church settings saved in this browser.');render()}
function showModal(title,body){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div>${body}</div></div>`;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()})}
function closeModal(){$('#modalRoot').innerHTML='';modalKind=null}
function deleteRecord(collection,id){if(!confirm('Delete this record? This action cannot be undone in this prototype. Export a backup first if needed.'))return;let map={transactions,pledges,claims,assets,campaigns};let arr=map[collection];if(!arr)return;let i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);save();render()}
function resetAll(){if(!confirm('Delete ALL locally stored Kingdom Treasure data from this browser? Export a backup first.'))return;transactions=[];pledges=[];claims=[];assets=[];campaigns=[];save();render();alert('Local data cleared.')}
window.addEventListener('storage',()=>{settings=Object.assign({},defaultSettings,JSON.parse(localStorage.getItem('kt_settings')||'{}'));transactions=JSON.parse(localStorage.getItem('kt_transactions')||'[]');pledges=JSON.parse(localStorage.getItem('kt_pledges')||'[]');claims=JSON.parse(localStorage.getItem('kt_claims')||'[]');assets=JSON.parse(localStorage.getItem('kt_assets')||'[]');campaigns=JSON.parse(localStorage.getItem('kt_campaigns')||'[]');render()});
render();
</script>
</body>
